<template>
    <div class="slds-modal__header">
        <h2 class="slds-text-heading_medium">Delete Product</h2>
    </div>
    <div class="slds-modal__content slds-p-around_medium">
        <p class="slds-text-align_center">Are you sure you want to delete this product?</p>
    </div>
    <div class="slds-modal__footer">
        <lightning-button
            label="Cancel"
            onclick={Cancel}
            class="slds-m-right_small">
        </lightning-button>
        <lightning-button
            label="Delete"
            variant="destructive"
            onclick={Delete}
            disabled={isLoading}>
        </lightning-button>
    </div>
</template>
