<template>
    <lightning-card title="Discount Management">
        
        <!-- GLOBAL SETTINGS -->
        <div class="slds-p-around_medium">
            <h2 class="slds-text-heading_medium slds-m-bottom_medium">Global Discount Settings</h2>
            <div class="slds-grid slds-gutters slds-m-bottom_medium">
                <div class="slds-col">
                    <lightning-combobox
                        label="Discount Strategy"
                        value={strategy}
                        options={strategyOptions}
                        onchange={handleStrategyChange}>
                    </lightning-combobox>
                </div>
                <div class="slds-col">
                    <lightning-input
                        type="number"
                        label="Minimum Discount Percentage"
                        value={minPercentage}
                        min="0"
                        max="100"
                        onchange={handleMinPercentageChange}>
                    </lightning-input>
                </div>
                <div class="slds-col slds-align-bottom">
                    <lightning-button
                        label="Save Settings"
                        variant="brand"
                        onclick={handleSaveSettings}>
                    </lightning-button>
                </div>
            </div>

            <!-- DISCOUNT LIST -->
            <h2 class="slds-text-heading_medium slds-m-bottom_medium">Discounts</h2>
            <div class="slds-m-bottom_medium">
                <lightning-button
                    label="Activate Selected"
                    variant="success"
                    onclick={handleActivate}
                    class="slds-m-right_small">
                </lightning-button>
                <lightning-button
                    label="Deactivate Selected"
                    variant="destructive"
                    onclick={handleDeactivate}
                    class="slds-m-right_small">
                </lightning-button>
                <lightning-button
                    label="New Discount"
                    variant="brand"
                    onclick={handleNewDiscount}>
                </lightning-button>
            </div>

            <template if:true={hasDiscounts}>
                <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                    <thead>
                        <tr>
                            <th><input type="checkbox" onchange={handleSelectAll}/></th>
                            <th>Name</th>
                            <th>Type</th>
                            <th>Form</th>
                            <th>Value</th>
                            <th>Active</th>
                            <th>Start Date</th>
                            <th>End Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={discounts} for:item="discount">
                            <tr key={discount.Id}>
                                <td>
                                    <lightning-input
                                        type="checkbox"
                                        label=""
                                        data-id={discount.Id}
                                        onchange={handleSelectDiscount}>
                                    </lightning-input>
                                </td>
                                <td>{discount.Name}</td>
                                <td>{discount.Type__c}</td>
                                <td>{discount.Discount_Form__c}</td>
                                <td>{discount.Value__c}</td>
                                <td>
                                    <lightning-icon
                                        icon-name={discount.activeIcon}
                                        size="x-small">
                                    </lightning-icon>
                                </td>
                                <td>{discount.Start_Date__c}</td>
                                <td>{discount.End_Date__c}</td>
                                <td>
                                    <lightning-button
                                        label="Edit"
                                        data-id={discount.Id}
                                        onclick={handleEditDiscount}
                                        disabled={discount.isAssigned}>
                                    </lightning-button>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </template>
        </div>

        <!-- DISCOUNT FORM MODAL -->
        <template if:true={showForm}>
            <section class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <h2 class="slds-text-heading_medium">{formTitle}</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <lightning-input
                            label="Name"
                            value={formDiscount.Name}
                            data-field="Name"
                            onchange={handleFormChange}>
                        </lightning-input>
                        <lightning-combobox
                            label="Type"
                            value={formDiscount.Type__c}
                            options={typeOptions}
                            data-field="Type__c"
                            onchange={handleFormChange}>
                        </lightning-combobox>
                        <lightning-combobox
                            label="Discount Form"
                            value={formDiscount.Discount_Form__c}
                            options={formOptions}
                            data-field="Discount_Form__c"
                            onchange={handleFormChange}>
                        </lightning-combobox>
                        <lightning-input
                            type="number"
                            label="Value"
                            value={formDiscount.Value__c}
                            data-field="Value__c"
                            onchange={handleFormChange}>
                        </lightning-input>
                        <lightning-input
                            type="checkbox"
                            label="Is Active"
                            checked={formDiscount.Is_Active__c}
                            data-field="Is_Active__c"
                            onchange={handleFormCheckbox}>
                        </lightning-input>
                        <lightning-input
                            type="date"
                            label="Start Date"
                            value={formDiscount.Start_Date__c}
                            data-field="Start_Date__c"
                            onchange={handleFormChange}>
                        </lightning-input>
                        <lightning-input
                            type="date"
                            label="End Date"
                            value={formDiscount.End_Date__c}
                            data-field="End_Date__c"
                            onchange={handleFormChange}>
                        </lightning-input>
                        <template if:true={isRecurring}>
                            <lightning-combobox
                                label="Recurrence Pattern"
                                value={formDiscount.Recurrence_Pattern__c}
                                options={recurrenceOptions}
                                data-field="Recurrence_Pattern__c"
                                onchange={handleFormChange}>
                            </lightning-combobox>
                        </template>
                        <template if:true={isConditional}>
                            <lightning-input
                                type="number"
                                label="Minimum Order Amount"
                                value={formDiscount.Minimum_Order_Amount__c}
                                data-field="Minimum_Order_Amount__c"
                                onchange={handleFormChange}>
                            </lightning-input>
                        </template>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button
                            label="Cancel"
                            onclick={handleCloseForm}
                            class="slds-m-right_small">
                        </lightning-button>
                        <lightning-button
                            label="Save"
                            variant="brand"
                            onclick={handleSaveDiscount}>
                        </lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

    </lightning-card>
</template>
