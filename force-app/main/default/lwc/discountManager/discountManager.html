<template>
    <lightning-card title="Discount Management">

        <!-- GLOBAL SETTINGS -->
        <div class="slds-p-around_medium">
            <h2 class="slds-text-heading_medium slds-m-bottom_medium">Global Discount Settings</h2>
            <div class="slds-grid slds-gutters slds-m-bottom_medium">
                <div class="slds-col">
                    <lightning-combobox
                        label="Discount Strategy"
                        value={strategy}
                        options={strategyOptions}
                        onchange={handleStrategyChange}>
                    </lightning-combobox>
                </div>
                <div class="slds-col">
                    <lightning-input
                        type="number"
                        label="Minimum Discount Percentage"
                        value={minPercentage}
                        min="0"
                        max="100"
                        onchange={handleMinPercentageChange}>
                    </lightning-input>
                </div>
                <div class="slds-col slds-align-bottom">
                    <lightning-button
                        label="Save Settings"
                        variant="brand"
                        onclick={handleSaveSettings}>
                    </lightning-button>
                </div>
            </div>

            <!-- DISCOUNT LIST -->
            <h2 class="slds-text-heading_medium slds-m-bottom_medium">Discounts</h2>
            <div class="slds-m-bottom_medium">
                <lightning-button
                    label="Activate Selected"
                    variant="success"
                    onclick={handleActivate}
                    class="slds-m-right_small">
                </lightning-button>
                <lightning-button
                    label="Deactivate Selected"
                    variant="destructive"
                    onclick={handleDeactivate}
                    class="slds-m-right_small">
                </lightning-button>
                <lightning-button
                    label="New Discount"
                    variant="brand"
                    onclick={handleNewDiscount}>
                </lightning-button>
            </div>

            <template if:true={hasDiscounts}>
                <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_fixed-layout">
                    <thead>
                        <tr class="slds-line-height_reset">
                            <th scope="col" style="width: 3rem;">
                                <span class="slds-checkbox">
                                    <input type="checkbox" onchange={handleSelectAll} id="select-all" />
                                    <label class="slds-checkbox__label" for="select-all">
                                        <span class="slds-checkbox_faux"></span>
                                        <span class="slds-form-element__label slds-assistive-text">Select All</span>
                                    </label>
                                </span>
                            </th>
                            <th scope="col"><div class="slds-truncate slds-th__action" title="Name">Name</div></th>
                            <th scope="col"><div class="slds-truncate slds-th__action" title="Type">Type</div></th>
                            <th scope="col"><div class="slds-truncate slds-th__action" title="Form">Form</div></th>
                            <th scope="col"><div class="slds-truncate slds-th__action" title="Value">Value</div></th>
                            <th scope="col" style="width: 5rem;"><div class="slds-truncate slds-th__action" title="Active">Active</div></th>
                            <th scope="col"><div class="slds-truncate slds-th__action" title="Start Date">Start Date</div></th>
                            <th scope="col"><div class="slds-truncate slds-th__action" title="End Date">End Date</div></th>
                            <th scope="col" style="width: 6rem;"><div class="slds-truncate slds-th__action" title="Actions">Actions</div></th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={discounts} for:item="discount">
                            <tr key={discount.Id}>
                                <td>
                                    <span class="slds-checkbox">
                                        <input
                                            type="checkbox"
                                            checked={discount.isSelected}
                                            data-id={discount.Id}
                                            onchange={handleSelectDiscount}
                                            id={discount.Id}
                                        />
                                        <label class="slds-checkbox__label" for={discount.Id}>
                                            <span class="slds-checkbox_faux"></span>
                                            <span class="slds-form-element__label slds-assistive-text">Select</span>
                                        </label>
                                    </span>
                                </td>
                                <td><span class="slds-truncate" title={discount.Name}>{discount.Name}</span></td>
                                <td><span class="slds-truncate" title={discount.Type__c}>{discount.Type__c}</span></td>
                                <td><span class="slds-truncate" title={discount.Discount_Form__c}>{discount.Discount_Form__c}</span></td>
                                <td><span class="slds-truncate">{discount.Value__c}</span></td>
                                <td>
                                    <lightning-icon
                                        icon-name={discount.activeIcon}
                                        size="x-small">
                                    </lightning-icon>
                                </td>
                                <td><span class="slds-truncate">{discount.Start_Date__c}</span></td>
                                <td><span class="slds-truncate">{discount.End_Date__c}</span></td>
                                <td>
                                    <lightning-button
                                        label="Edit"
                                        size="small"
                                        data-id={discount.Id}
                                        onclick={handleEditDiscount}
                                        disabled={discount.isAssigned}>
                                    </lightning-button>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </template>
        </div>

        <!-- DISCOUNT FORM MODAL -->
        <template if:true={showForm}>
            <section class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <lightning-button-icon
                            class="slds-modal__close"
                            icon-name="utility:close"
                            icon-class="slds-button__icon_large"
                            variant="bare-inverse"
                            onclick={handleCloseForm}>
                        </lightning-button-icon>
                        <h2 class="slds-text-heading_medium">{formTitle}</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <div class="slds-m-bottom_small">
                            <lightning-input
                                label="Name"
                                value={formDiscount.Name}
                                data-field="Name"
                                onchange={handleFormChange}>
                            </lightning-input>
                        </div>
                        <div class="slds-m-bottom_small">
                            <lightning-combobox
                                label="Type"
                                value={formDiscount.Type__c}
                                options={typeOptions}
                                data-field="Type__c"
                                onchange={handleFormChange}>
                            </lightning-combobox>
                        </div>
                        <div class="slds-m-bottom_small">
                            <lightning-combobox
                                label="Discount Form"
                                value={formDiscount.Discount_Form__c}
                                options={formOptions}
                                data-field="Discount_Form__c"
                                onchange={handleFormChange}>
                            </lightning-combobox>
                        </div>
                        <div class="slds-m-bottom_small">
                            <lightning-input
                                type="number"
                                label="Value"
                                value={formDiscount.Value__c}
                                data-field="Value__c"
                                onchange={handleFormChange}>
                            </lightning-input>
                        </div>
                        <div class="slds-m-bottom_small">
                            <lightning-input
                                type="checkbox"
                                label="Is Active"
                                checked={formDiscount.Is_Active__c}
                                data-field="Is_Active__c"
                                onchange={handleFormCheckbox}>
                            </lightning-input>
                        </div>
                        <div class="slds-m-bottom_small">
                            <lightning-input
                                type="date"
                                label="Start Date"
                                value={formDiscount.Start_Date__c}
                                data-field="Start_Date__c"
                                onchange={handleFormChange}>
                            </lightning-input>
                        </div>
                        <div class="slds-m-bottom_small">
                            <lightning-input
                                type="date"
                                label="End Date"
                                value={formDiscount.End_Date__c}
                                data-field="End_Date__c"
                                onchange={handleFormChange}>
                            </lightning-input>
                        </div>
                        <template if:true={isRecurring}>
                            <div class="slds-m-bottom_small">
                                <lightning-combobox
                                    label="Recurrence Pattern"
                                    value={formDiscount.Recurrence_Pattern__c}
                                    options={recurrenceOptions}
                                    data-field="Recurrence_Pattern__c"
                                    onchange={handleFormChange}>
                                </lightning-combobox>
                            </div>
                        </template>
                        <template if:true={isConditional}>
                            <div class="slds-m-bottom_small">
                                <lightning-input
                                    type="number"
                                    label="Minimum Order Amount"
                                    value={formDiscount.Minimum_Order_Amount__c}
                                    data-field="Minimum_Order_Amount__c"
                                    onchange={handleFormChange}>
                                </lightning-input>
                            </div>
                        </template>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button
                            label="Cancel"
                            onclick={handleCloseForm}
                            class="slds-m-right_small">
                        </lightning-button>
                        <lightning-button
                            label="Save"
                            variant="brand"
                            onclick={handleSaveDiscount}>
                        </lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

    </lightning-card>
</template>
