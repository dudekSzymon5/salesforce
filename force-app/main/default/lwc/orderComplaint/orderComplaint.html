<template>
    <lightning-modal-header label="New Complaint"></lightning-modal-header>
<lightning-modal-body>
    <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_col-bordered">
        <thead>
            <tr class="slds-line-height_reset">
                <th scope="col" style="width: 3rem;"></th>
                <th scope="col"><div class="slds-truncate">Product</div></th>
                <th scope="col"><div class="slds-truncate">Quantity</div></th>
                <th scope="col"><div class="slds-truncate">Unit Price</div></th>
            </tr>
        </thead>
        <tbody>
            <template for:each={products} for:item="product">
                <tr key={product.Id}>
                    <td>
                        <lightning-input
                            type="checkbox"
                            label=""
                            data-id={product.Id}
                            onchange={handleProductSelect}>
                        </lightning-input>
                    </td>
                    <td>{product.name}</td>
                    <td>{product.quantity}</td>
                    <td>{product.unitPrice} $</td>
                </tr>
            </template>
        </tbody>
    </table>

    <lightning-textarea
        label = "Complaint Reason"
        value = {reason}
        onchange= {handleReasonChange}>
    </lightning-textarea>

    <lightning-combobox
        label = "What kind of refund do you expect?"
        value = {expectedRefundType}
        options={refundOptions}
        onchange={handleRefundChange}>
    </lightning-combobox>
</lightning-modal-body>

<lightning-modal-footer>
    <lightning-button label = "Cancel" onclick={handleCancel}></lightning-button>

    <lightning-button
        label = "Submit"
        variant = "brand"
        onclick = {handleSubmit}
        disabled= {isSubmitDisabled}>
    </lightning-button>
    
</lightning-modal-footer>
</template>
