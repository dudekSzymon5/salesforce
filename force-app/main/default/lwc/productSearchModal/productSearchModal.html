<template>
    <lightning-card>
        <!-- KROK 1: Wyszukiwarka -->
        <template if:true={isSearchStep}>
            <div class="slds-p-around_medium">
                <h2 class="slds-text-heading_medium slds-m-bottom_medium">Wybierz produkty</h2>
                <div class="slds-grid slds-gutters slds-m-bottom_medium">
                    <div class="slds-col">
                        <lightning-input
                            label="Nazwa produktu"
                            value={searchName}
                            onchange={handleSearchName}>
                        </lightning-input>
                    </div>
                    <div class="slds-col">
                        <lightning-combobox
                            label="Rodzina produktu"
                            value={searchFamily}
                            options={familyOptions}
                            onchange={handleSearchFamily}>
                        </lightning-combobox>
                    </div>
                    <div class="slds-col slds-align-bottom">
                        <lightning-button
                            label="Szukaj"
                            variant="brand"
                            onclick={handleSearch}>
                        </lightning-button>
                    </div>
                </div>
                <template if:true={hasDiscounts}>
                    <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                        <thead>
                            <tr>
                                <th>Wybierz</th>
                                <th>Nazwa</th>
                                <th>Rodzina</th>
                                <th>Cena</th>
                                <th>Ilość</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={products} for:item="product">
                                <tr key={product.Id}>
                                    <td>
                                        <lightning-input
                                            type="checkbox"
                                            label=""
                                            data-id={product.Id}
                                            onchange={handleProductSelect}>
                                        </lightning-input>
                                    </td>
                                    <td>{product.Product2.Name}</td>
                                    <td>{product.Product2.Family}</td>
                                    <td>{product.UnitPrice}</td>
                                    <td>
                                        <lightning-input
                                            type="number"
                                            label=""
                                            min="1"
                                            value="1"
                                            data-id={product.Id}
                                            onchange={handleQuantityChange}>
                                        </lightning-input>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </template>
                <template if:true={isLoading}>
                    <lightning-spinner alternative-text="Ładowanie..."></lightning-spinner>
                </template>
            </div>
            <div slot="footer">
                <lightning-button
                    label="Anuluj"
                    onclick={handleCancel}
                    class="slds-m-right_small">
                </lightning-button>
                <lightning-button
                    label="Next"
                    variant="brand"
                    onclick={handleNext}
                    disabled={isNextDisabled}>
                </lightning-button>
            </div>
        </template>

        <!-- KROK 2: Podsumowanie -->
        <template if:true={isSummaryStep}>
            <div class="slds-p-around_medium">
                <h2 class="slds-text-heading_medium slds-m-bottom_medium">Podsumowanie zamówienia</h2>
                <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                    <thead>
                        <tr>
                            <th>Produkt</th>
                            <th>Cena jednostkowa</th>
                            <th>Ilość</th>
                            <th>Łącznie</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={selectedProductsList} for:item="item">
                            <tr key={item.pricebookEntryId}>
                                <td>{item.name}</td>
                                <td>{item.unitPrice}</td>
                                <td>{item.quantity}</td>
                                <td>{item.total}</td>
                            </tr>
                        </template>
                    </tbody>
                    <tfoot>
                        <tr>
                            <td colspan="3"><strong>Suma</strong></td>
                            <td><strong>{totalAmount}</strong></td>
                        </tr>
                    </tfoot>
                </table>
            </div>
            <div slot="footer">
                <lightning-button
                    label="Wróć"
                    onclick={handleBack}
                    class="slds-m-right_small">
                </lightning-button>
                <lightning-button
                    label="Submit"
                    variant="brand"
                    onclick={handleSubmit}>
                </lightning-button>
            </div>
        </template>

        <!-- KROK 3: Zniżki -->
        <template if:true={isDiscountStep}>
            <div class="slds-p-around_medium">
                <h2 class="slds-text-heading_medium slds-m-bottom_medium">Order Summary with Discounts</h2>
                <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Original Price</th>
                            <th>Quantity</th>
                            <th>Total</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={selectedProductsList} for:item="item">
                            <tr key={item.pricebookEntryId}>
                                <td>{item.name}</td>
                                <td>{item.unitPrice}</td>
                                <td>{item.quantity}</td>
                                <td>{item.total}</td>
                            </tr>
                        </template>
                    </tbody>
                </table>
                <template if:true={hasDiscounts}>
                    <h3 class="slds-text-heading_small slds-m-top_medium slds-m-bottom_small">Applied Discounts</h3>
                    <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                        <thead>
                            <tr>
                                <th>Discount</th>
                                <th>Original Price</th>
                                <th>Discount Value</th>
                                <th>Price After Discount</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={appliedDiscounts} for:item="od">
                                <tr key={od.Id}>
                                    <td>{od.Discount__r.Name}</td>
                                    <td>
                                        <span style="text-decoration: line-through">
                                            {od.Original_Price__c}
                                        </span>
                                    </td>
                                    <td>{od.Applied_Value__c}</td>
                                    <td>{od.Discounted_Price__c}</td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </template>
                <template if:false={hasDiscounts}>
                    <p class="slds-m-top_medium">No discounts applied.</p>
                </template>
            </div>
            <div slot="footer">
                <lightning-button
                    label="Go to Order"
                    variant="brand"
                    onclick={handleFinish}>
                </lightning-button>
            </div>
        </template>
    </lightning-card>
</template>
