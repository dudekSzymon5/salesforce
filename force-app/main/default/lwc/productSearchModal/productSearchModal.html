<template>
    <lightning-card>
        <!-- STEP 1: Search -->
        <template if:true={isSearchStep}>
            <div class="slds-p-around_medium">
                <h2 class="slds-text-heading_medium slds-m-bottom_medium">Select Products</h2>
                <div class="slds-grid slds-gutters slds-m-bottom_medium">
                    <div class="slds-col">
                        <lightning-input
                            label="Product Name"
                            placeholder="Search by name..."
                            value={searchName}
                            onchange={handleSearchName}>
                        </lightning-input>
                    </div>
                    <div class="slds-col">
                        <lightning-combobox
                            label="Product Family"
                            value={searchFamily}
                            options={familyOptions}
                            onchange={handleSearchFamily}>
                        </lightning-combobox>
                    </div>
                    <div class="slds-col slds-align-bottom">
                        <lightning-button
                            label="Search"
                            variant="brand"
                            onclick={handleSearch}>
                        </lightning-button>
                    </div>
                </div>
                <div class="content-scroll">
                    <template if:true={isLoading}>
                        <lightning-spinner alternative-text="Loading..."></lightning-spinner>
                    </template>
                    <template if:true={products}>
                        <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                            <thead>
                                <tr>
                                    <th>Select</th>
                                    <th>Name</th>
                                    <th>Family</th>
                                    <th>Price</th>
                                    <th style="width: 7rem;">Quantity</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={productsWithSelection} for:item="product">
                                    <tr key={product.Id}>
                                        <td>
                                            <lightning-input
                                                type="checkbox"
                                                label=""
                                                checked={product.isSelected}
                                                data-id={product.Id}
                                                onchange={handleProductSelect}>
                                            </lightning-input>
                                        </td>
                                        <td>{product.Product2.Name}</td>
                                        <td>{product.Product2.Family}</td>
                                        <td>
                                            <lightning-formatted-number
                                                value={product.UnitPrice}
                                                format-style="currency">
                                            </lightning-formatted-number>
                                        </td>
                                        <td>
                                            <lightning-input
                                                type="number"
                                                label=""
                                                min="1"
                                                value={product.currentQuantity}
                                                data-id={product.Id}
                                                onchange={handleQuantityChange}>
                                            </lightning-input>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </template>
                </div>
            </div>
            <div slot="footer">
                <lightning-button
                    label="Cancel"
                    onclick={handleCancel}
                    class="slds-m-right_small">
                </lightning-button>
                <lightning-button
                    label="Next"
                    variant="brand"
                    onclick={handleNext}
                    disabled={isNextDisabled}>
                </lightning-button>
            </div>
        </template>

        <!-- STEP 2: Order Summary with Discounts -->
        <template if:true={isSummaryStep}>
            <div class="slds-p-around_medium">
                <h2 class="slds-text-heading_medium slds-m-bottom_medium">Order Summary</h2>
                <template if:true={isLoading}>
                    <lightning-spinner alternative-text="Calculating discounts..."></lightning-spinner>
                </template>
                <template if:false={isLoading}>
                    <div class="content-scroll">
                        <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                            <thead>
                                <tr>
                                    <th>Product</th>
                                    <th>Unit Price</th>
                                    <th>Quantity</th>
                                    <th>Total</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={selectedProductsList} for:item="item">
                                    <tr key={item.pricebookEntryId}>
                                        <td>{item.name}</td>
                                        <td>
                                            <lightning-formatted-number
                                                value={item.unitPrice}
                                                format-style="currency">
                                            </lightning-formatted-number>
                                        </td>
                                        <td>{item.quantity}</td>
                                        <td>
                                            <lightning-formatted-number
                                                value={item.total}
                                                format-style="currency">
                                            </lightning-formatted-number>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                            <tfoot>
                                <tr>
                                    <td colspan="3"><strong>Subtotal</strong></td>
                                    <td>
                                        <strong>
                                            <lightning-formatted-number
                                                value={totalAmount}
                                                format-style="currency">
                                            </lightning-formatted-number>
                                        </strong>
                                    </td>
                                </tr>
                            </tfoot>
                        </table>

                        <!-- Applied Discounts -->
                        <template if:true={hasDiscounts}>
                            <h3 class="slds-text-heading_small slds-m-top_medium slds-m-bottom_small">Applied Discounts</h3>
                            <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                                <thead>
                                    <tr>
                                        <th>Discount</th>
                                        <th>Original Price</th>
                                        <th>Discount Value</th>
                                        <th>Price After Discount</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={discountPreviews} for:item="d">
                                        <tr key={d.discountName}>
                                            <td>{d.discountName}</td>
                                            <td>
                                                <span class="original-price">
                                                    <lightning-formatted-number
                                                        value={d.originalPrice}
                                                        format-style="currency">
                                                    </lightning-formatted-number>
                                                </span>
                                            </td>
                                            <td class="discount-value">
                                                −&nbsp;<lightning-formatted-number
                                                    value={d.appliedValue}
                                                    format-style="currency">
                                                </lightning-formatted-number>
                                            </td>
                                            <td>
                                                <strong>
                                                    <lightning-formatted-number
                                                        value={d.discountedPrice}
                                                        format-style="currency">
                                                    </lightning-formatted-number>
                                                </strong>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                                <tfoot>
                                    <tr>
                                        <td colspan="3"><strong>Total After Discounts</strong></td>
                                        <td>
                                            <strong class="slds-text-color_success">
                                                <lightning-formatted-number
                                                    value={discountedTotal}
                                                    format-style="currency">
                                                </lightning-formatted-number>
                                            </strong>
                                        </td>
                                    </tr>
                                </tfoot>
                            </table>
                        </template>

                        <template if:false={hasDiscounts}>
                            <p class="slds-m-top_medium slds-text-body_regular slds-text-color_weak">
                                No discounts applicable for this order.
                            </p>
                        </template>
                    </div>
                </template>
            </div>
            <div slot="footer">
                <lightning-button
                    label="Back"
                    onclick={handleBack}
                    class="slds-m-right_small">
                </lightning-button>
                <lightning-button
                    label="Submit"
                    variant="brand"
                    onclick={handleSubmit}
                    disabled={isLoading}>
                </lightning-button>
            </div>
        </template>
    </lightning-card>
</template>
