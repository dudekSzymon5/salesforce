<template>
    <lightning-card>
        <!-- STEP 1: Search -->
        <template if:true={isSearchStep}>
            <div class="slds-p-around_medium">
                <h2 class="slds-text-heading_medium slds-m-bottom_medium">Select Products</h2>
                <div class="slds-grid slds-gutters slds-m-bottom_medium">
                    <div class="slds-col">
                        <lightning-input
                            label="Product Name"
                            placeholder="Search by name..."
                            value={searchName}
                            onchange={handleSearchName}>
                        </lightning-input>
                    </div>
                    <div class="slds-col">
                        <lightning-combobox
                            label="Product Family"
                            value={searchFamily}
                            options={familyOptions}
                            onchange={handleSearchFamily}>
                        </lightning-combobox>
                    </div>
                    <div class="slds-col slds-align-bottom">
                        <lightning-button
                            label="Search"
                            variant="brand"
                            onclick={handleSearch}>
                        </lightning-button>
                    </div>
                </div>
                <div class="content-scroll">
                    <template if:true={products}>
                        <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                            <thead>
                                <tr>
                                    <th>Select</th>
                                    <th>Name</th>
                                    <th>Family</th>
                                    <th>Price</th>
                                    <th style="width: 7rem;">Quantity</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={products} for:item="product">
                                    <tr key={product.Id}>
                                        <td>
                                            <lightning-input
                                                type="checkbox"
                                                label=""
                                                data-id={product.Id}
                                                onchange={handleProductSelect}>
                                            </lightning-input>
                                        </td>
                                        <td>{product.Product2.Name}</td>
                                        <td>{product.Product2.Family}</td>
                                        <td>
                                            <lightning-formatted-number
                                                value={product.UnitPrice}
                                                format-style="currency">
                                            </lightning-formatted-number>
                                        </td>
                                        <td>
                                            <lightning-input
                                                type="number"
                                                label=""
                                                min="1"
                                                value="1"
                                                data-id={product.Id}
                                                onchange={handleQuantityChange}>
                                            </lightning-input>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </template>
                    <template if:true={isLoading}>
                        <lightning-spinner alternative-text="Loading..."></lightning-spinner>
                    </template>
                </div>
            </div>
            <div slot="footer">
                <lightning-button
                    label="Cancel"
                    onclick={handleCancel}
                    class="slds-m-right_small">
                </lightning-button>
                <lightning-button
                    label="Next"
                    variant="brand"
                    onclick={handleNext}
                    disabled={isNextDisabled}>
                </lightning-button>
            </div>
        </template>

        <!-- STEP 2: Summary -->
        <template if:true={isSummaryStep}>
            <div class="slds-p-around_medium">
                <h2 class="slds-text-heading_medium slds-m-bottom_medium">Order Summary</h2>
                <div class="content-scroll">
                <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Unit Price</th>
                            <th>Quantity</th>
                            <th>Total</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={selectedProductsList} for:item="item">
                            <tr key={item.pricebookEntryId}>
                                <td>{item.name}</td>
                                <td>
                                    <lightning-formatted-number
                                        value={item.unitPrice}
                                        format-style="currency">
                                    </lightning-formatted-number>
                                </td>
                                <td>{item.quantity}</td>
                                <td>
                                    <lightning-formatted-number
                                        value={item.total}
                                        format-style="currency">
                                    </lightning-formatted-number>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                    <tfoot>
                        <tr>
                            <td colspan="3"><strong>Total</strong></td>
                            <td>
                                <strong>
                                    <lightning-formatted-number
                                        value={totalAmount}
                                        format-style="currency">
                                    </lightning-formatted-number>
                                </strong>
                            </td>
                        </tr>
                    </tfoot>
                </table>
                </div>
            </div>
            <div slot="footer">
                <lightning-button
                    label="Back"
                    onclick={handleBack}
                    class="slds-m-right_small">
                </lightning-button>
                <lightning-button
                    label="Submit"
                    variant="brand"
                    onclick={handleSubmit}>
                </lightning-button>
            </div>
        </template>

        <!-- STEP 3: Discounts -->
        <template if:true={isDiscountStep}>
            <div class="slds-p-around_medium">
                <h2 class="slds-text-heading_medium slds-m-bottom_medium">Order Summary with Discounts</h2>
                <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Original Price</th>
                            <th>Quantity</th>
                            <th>Total</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={selectedProductsList} for:item="item">
                            <tr key={item.pricebookEntryId}>
                                <td>{item.name}</td>
                                <td>
                                    <lightning-formatted-number
                                        value={item.unitPrice}
                                        format-style="currency">
                                    </lightning-formatted-number>
                                </td>
                                <td>{item.quantity}</td>
                                <td>
                                    <lightning-formatted-number
                                        value={item.total}
                                        format-style="currency">
                                    </lightning-formatted-number>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
                <template if:true={hasDiscounts}>
                    <h3 class="slds-text-heading_small slds-m-top_medium slds-m-bottom_small">Applied Discounts</h3>
                    <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                        <thead>
                            <tr>
                                <th>Discount</th>
                                <th>Original Price</th>
                                <th>Discount Value</th>
                                <th>Price After Discount</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={appliedDiscounts} for:item="od">
                                <tr key={od.Id}>
                                    <td>{od.Discount__r.Name}</td>
                                    <td>
                                        <span style="text-decoration: line-through; color: #666;">
                                            <lightning-formatted-number
                                                value={od.Original_Price__c}
                                                format-style="currency">
                                            </lightning-formatted-number>
                                        </span>
                                    </td>
                                    <td>
                                        <lightning-formatted-number
                                            value={od.Applied_Value__c}
                                            format-style="currency">
                                        </lightning-formatted-number>
                                    </td>
                                    <td>
                                        <strong>
                                            <lightning-formatted-number
                                                value={od.Discounted_Price__c}
                                                format-style="currency">
                                            </lightning-formatted-number>
                                        </strong>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </template>
                <template if:false={hasDiscounts}>
                    <p class="slds-m-top_medium">No discounts applied.</p>
                </template>
            </div>
            <div slot="footer">
                <lightning-button
                    label="Go to Order"
                    variant="brand"
                    onclick={handleFinish}>
                </lightning-button>
            </div>
        </template>
    </lightning-card>
</template>
