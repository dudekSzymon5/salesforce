<template>
    <lightning-modal-header label="Complaint Decision"></lightning-modal-header>
    <lightning-modal-body>
        <lightning-combobox
            label="Refund Decision"
            value={approvedRefundType}
            options={refundOptions}
            onchange={handleRefundChange}>
        </lightning-combobox>

        <template if:true={showPartialInput}>
            <lightning-input
                type="number"
                label="Refund Amount"
                value={refundAmount}
                min="0"
                max={maxRefundAmount}
                step="0.01"
                formatter="currency"
                field-level-help={maxRefundLabel}
                onchange={handleAmountChange}>
            </lightning-input>
        </template>

        <lightning-textarea
            label="Comment"
            value={comments}
            onchange={handleCommentsChange}>
        </lightning-textarea>
    </lightning-modal-body>
    <lightning-modal-footer>
        <lightning-button label="Cancel" onclick={handleCancel}></lightning-button>
        <lightning-button
            label="Submit"
            variant="brand"
            class="slds-m-left_small"
            onclick={handleApprove}
            disabled={isApproveDisabled}>
        </lightning-button>
    </lightning-modal-footer>
</template>
