<template>
    <template if:true={showModal}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <h2 class="slds-text-heading_medium">Order &amp; Contract Created Successfully</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium slds-text-align_center">
                        <lightning-icon icon-name="action:approval" size="large" class="slds-m-bottom_small"></lightning-icon>
                        <p>Click the buttons below to navigate to your newly created <b>Order</b> or <b>Contract</b>.</p>
                        <br/>
                        <lightning-button 
                            variant="brand" 
                            label="View Order" 
                            onclick={goToOrder}
                            class="slds-m-right_small">
                        </lightning-button>
                        <lightning-button 
                            variant="brand" 
                            label="View Contract" 
                            onclick={goToContract}>
                        </lightning-button>
                    </div>
                <footer class="slds-modal__footer">
                    <lightning-button 
                        variant="neutral"
                        label="Close" 
                        onclick={closeModal}>
                    </lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
